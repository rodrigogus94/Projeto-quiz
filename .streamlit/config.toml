# Tema padrão do Streamlit; a alternância Claro/Escuro do app usa CSS em ui_theme.py.
[theme]
base = "light"

[theme.light]
primaryColor = "#458588"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#000000"

[theme.dark]
primaryColor = "#458588"
backgroundColor = "#1d2021"
secondaryBackgroundColor = "#2d3436"
textColor = "#e8edf2"

[browser]
gatherUsageStats = false

[client]
# Esconde o menu do canto superior; opções ficam no menu da conta (sidebar).
toolbarMode = "minimal"
